name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. Quality Gate (Runs on EVERY push to main and pull requests) ────────
  verify:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew :app:lintRelease
        env:
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}

      - name: Run Unit Tests
        run: ./gradlew :app:testReleaseUnitTest
        env:
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}

      - name: Upload Test Results on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/testReleaseUnitTest/

  # ── 2. Build & Deploy (Runs on push to main AFTER verification passes) ─────
  deploy:
    name: Build & Deploy to Play Store
    runs-on: ubuntu-latest
    needs: [verify]
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x gradlew

      - name: Auto-increment Version Patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git fetch origin main
          old_patch=$(git show origin/main:gradle.properties | grep '^VERSION_PATCH=' | cut -d'=' -f2 | tr -d '\r')
          new_patch=$((old_patch + 1))
          sed -i "s/^VERSION_PATCH=.*/VERSION_PATCH=$new_patch/" gradle.properties
          
          git add gradle.properties
          git commit -m "chore: bump version to $new_patch [skip ci]"
          
          git rebase origin/main
          git push origin HEAD:main
          
          VERSION_MAJOR=$(grep '^VERSION_MAJOR=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          VERSION_MINOR=$(grep '^VERSION_MINOR=' gradle.properties | cut -d'=' -f2 | tr -d '\r')
          echo "VERSION_NAME=$VERSION_MAJOR.$VERSION_MINOR.$new_patch" >> $GITHUB_ENV

      - name: Build Release Bundle
        run: ./gradlew :app:bundleRelease
        env:
          GOOGLE_WEATHER_API_KEY: ${{ secrets.GOOGLE_WEATHER_API_KEY }}
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Sign Bundle
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        with:
          releaseDirectory: app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY_BASE64 }}
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload to Play Store (Internal Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: com.clockweather.app
          releaseFiles: ${{ steps.sign_app.outputs.signedReleaseFile }}
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          tracks: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }}

      - name: Create Git Tag on Success
        if: success()
        run: |
          TAG_NAME="v${{ env.VERSION_NAME }}"
          
          echo "========================================================="
          echo "SUCCESSFULLY PUBLISHED TO GOOGLE PLAY CONSOLE (INTERNAL)"
          echo "   Created Google Play Release Version: ${{ env.VERSION_NAME }}"
          echo "   Created Git Tag:                     $TAG_NAME"
          echo "========================================================="
          
          git tag $TAG_NAME
          git push origin $TAG_NAME
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
